name: lifetap
description: LIFETAP — Emergency Response App for Instituto Tecnológico de Tijuana
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_database: ^11.1.0
  firebase_messaging: ^15.0.0
  firebase_storage: ^12.1.0

  # Maps & Location
  google_maps_flutter: ^2.6.0
  geolocator: ^12.0.0

  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.1.4

  # Media
  image_picker: ^1.1.2

  # Sensors
  sensors_plus: ^5.0.1

  # Notifications
  flutter_local_notifications: ^17.1.2

  # Storage & Cache
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1

  # Utils
  intl: 0.20.2
  timeago: ^3.6.1
  permission_handler: ^11.3.1
  uuid: ^4.4.0
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/


